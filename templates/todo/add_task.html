{% extends "base.html" %}

{% block title %}Add Task{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="bg-white shadow-xl rounded-2xl p-8">

        <h1 class="text-3xl font-bold text-indigo-600 mb-6">
            Add New Task
        </h1>

        <form method="POST">

            {% csrf_token %}

            <div class="space-y-5">

                <div class="space-y-5">

    {% for field in form %}

    <div>

        <label class="block mb-2 font-semibold">

            {{ field.label }}

        </label>

        {{ field }}

        {% if field.errors %}

            <p class="text-red-500 text-sm mt-1">

                {{ field.errors|striptags }}

            </p>

        {% endif %}

    </div>

    {% endfor %}

</div>

            </div>

            <button
                type="submit"
                class="mt-6 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg">

                Save Task

            </button>

        </form>

    </div>

</div>

{% endblock %}
